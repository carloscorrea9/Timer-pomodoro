<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Timer Pomodoro PJ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./global/style.css">
</head>

<body>

  <h1>Timer Pomodoro Projeto</h1>
  <h2>Configurações</h2>
  <div class="configs">
    <label>Quanto tempo de foco: <input type="number" id="foco" placeholder="Minutos..."></label>
    <label>Quanto tempo de descanso: <input type="number" id="descanso" placeholder="Minutos..."></label>
    <label>Meta diária de estudo: <input type="number" id="meta" placeholder="Horas..."></label>
    <button>Salvar Configurações</button>
  </div>

  <div id="timer">00:00</div>

  <div class="buttons">
    <button id="start">Iniciar</button>
    <button id="pause">Pausar</button>
    <button id="reset">Resetar</button>
    <button id="manual">Registrar tempo estudado</button>
  </div>

  <h2>Histórico</h2>
  <ul id="historico"></ul>

  <script src="script.js"></script>
  </div>

  <body>

</html>
